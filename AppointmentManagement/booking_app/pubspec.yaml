name: booking_app
description: A professional appointment booking SaaS platform for service businesses.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  postgres: ^2.6.2
  flutter:
    sdk: flutter


  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.0.0

  # Payments
  flutter_stripe: ^10.1.1

  # UI & UX
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Date & Time
  table_calendar: ^3.1.2
  intl: ^0.20.0

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  http: ^1.2.1
  equatable: ^2.0.5

  # Notifications
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
